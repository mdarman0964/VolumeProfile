          - REQUEST_INVALID_FILTER_COMBINATION
          - AUTH_INVALID_API_KEY
          - AUTH_INVALID_SIGNATURE
          - AUTH_PERMISSION_DENIED
          - ACCOUNT_NOT_FOUND
          - MARKET_INSTRUMENT_NOT_FOUND
          - REQUEST_RATE_LIMIT
          - SYSTEM_TEMPORARY_UNAVAILABLE
          - SYSTEM_INTERNAL_ERROR
      parameters:
          - $ref: "#/components/parameters/AccountIdPath"
          - name: from
            in: query
            required: false
            description: Inclusive range start in UTC. Required when `cursor` is not provided. Must be earlier than the current server time.
            schema:
              type: string
              format: date-time
          - name: to
            in: query
            required: false
            description: |
              Exclusive range end in UTC.
              Must be later than `from`.
              The requested window must be within the configured history age.
              The requested range must not exceed the configured history range.
            schema:
              type: string
              format: date-time
          - name: cursor
            in: query
            required: false
            description: Opaque continuation token returned by the previous response page.
            schema:
              type: string
          - name: limit
