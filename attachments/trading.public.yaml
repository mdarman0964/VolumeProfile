          $ref: "#/components/responses/AccountNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/configuration/accounts/{account_id}/limits:
    get:
      tags:
        - Configuration
      summary: Get API limits
      description: |
        Returns the effective REST and WebSocket limits for the account. REST limits are reported
        for the whole AP cluster; WebSocket limits are enforced per server node.
      operationId: getLimits
      x-public-error-codes:
        - REQUEST_INVALID
        - AUTH_INVALID_API_KEY
        - AUTH_INVALID_SIGNATURE
        - AUTH_PERMISSION_DENIED
        - ACCOUNT_NOT_FOUND
        - REQUEST_RATE_LIMIT
        - SYSTEM_TEMPORARY_UNAVAILABLE
        - SYSTEM_INTERNAL_ERROR
      parameters:
        - $ref: "#/components/parameters/AccountIdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthorizationFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AccountNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    ExnApiKeyAuth:
      type: apiKey
      in: header
      name: EXN-API-KEY
      description: |
        Public API key identifier used by signed requests.

        This value must match the `api_key` field inside the signed `EXN-DATA` payload.
        Unknown, expired, or mismatched API keys are returned as `AUTH_INVALID_API_KEY`.

    ExnTimestampAuth:
      type: apiKey
      in: header
      name: EXN-TIMESTAMP
      description: |
        Unix timestamp in milliseconds used by signed requests.

        This value must match the `timestamp` field inside the signed `EXN-DATA` payload.
        Clients should generate a fresh timestamp and signature for every request.
        Requests outside the accepted server time window are rejected.

    ExnDataAuth:
      type: apiKey
      in: header
      name: EXN-DATA
      description: |
        Base64url-encoded signed data payload, without `=` padding.

        The decoded payload is a JSON object with the following fields:
        - `api_key`: same value as `EXN-API-KEY`
        - `idempotency_key`: same value as `EXN-IDEMPOTENCY-KEY`; empty string for signed `GET` requests
        - `timestamp`: same value as `EXN-TIMESTAMP`
        - `sign_version`: same value as `EXN-SIGN-VERSION`
        - `method`: uppercase HTTP method, for example `POST`
        - `path`: request path with query string exactly as sent by the client
        - `body_hash`: SHA-256 hash of the request body, base64url-encoded without padding

        Example decoded payload:
        ```json
        {
          "api_key": "exnsk-live-example",
          "idempotency_key": "order-20260316-0001",
          "timestamp": 1773656070123,
          "sign_version": 1,
          "method": "POST",
          "path": "/v1/trading/accounts/123456789/orders",
          "body_hash": "47DEQpj8HBSa-_TImW-5JCeuQeRkm5NMpJWZG3hSuFU"
        }
        ```

    ExnSignatureAuth:
      type: apiKey
      in: header
      name: EXN-SIGN
      description: |
        Ed25519 signature for the decoded `EXN-DATA` payload, encoded as base64url without `=` padding.

        Invalid signatures are returned as `AUTH_INVALID_SIGNATURE`.

    ExnSignVersionAuth:
      type: apiKey
      in: header
      name: EXN-SIGN-VERSION
      description: |
        Signature protocol version.

        The only supported value is `1`. This value must match the `sign_version` field inside `EXN-DATA`.

    ExnIdempotencyKeyAuth:
      type: apiKey
      in: header
      name: EXN-IDEMPOTENCY-KEY
      description: |
        Idempotency and correlation key for signed requests.

        For mutating requests, this header is required and must contain a 5..128 character key.
        For signed `GET` requests, this header is still required by the signature protocol,
        but its value must be empty.
        This value must match the `idempotency_key` field inside `EXN-DATA`.

        Allowed characters for non-empty keys are `A-Z`, `a-z`, `0-9`, `.`, `_`, `-`, `~`.

  parameters:
    AccountIdPath:
      name: account_id
      in: path
      required: true
      description: Trading account number (associated with API key)
      schema:
        $ref: "#/components/schemas/UInt64String"

    ExnIdempotencyKey:
      name: EXN-IDEMPOTENCY-KEY
      in: header
      required: true
      description: |
        Idempotency and correlation key for signed requests.

        For mutating requests, this header is required and must contain a 5..128 character key.
        For signed `GET` requests, this header is still required by the signature protocol,
        but its value must be empty.
        This value must match the `idempotency_key` field inside `EXN-DATA`.
      schema:
        oneOf:
          - type: string
            const: ""
            description: Required empty value for signed GET requests.
          - type: string
            minLength: 5
            maxLength: 128
            pattern: '^[A-Za-z0-9._~-]{5,128}$'
            description: Required non-empty value for signed mutating requests.

    InstrumentFilter:
      name: instrument
      in: query
      required: false
      description: Instrument symbolic identifier filter
      schema:
        $ref: "#/components/schemas/InstrumentName"

  responses:
    BadRequest:
      description: |
        Bad Request.

        Possible public error codes include:
        - `REQUEST_INVALID`
        - `REQUEST_INVALID_PARAMETERS`
        - `REQUEST_INVALID_PRICE`
        - `REQUEST_INVALID_TIMEFRAME`
        - `REQUEST_INVALID_TIME_RANGE`
        - `REQUEST_INVALID_COUNT`
        - `REQUEST_INVALID_LIMIT`
        - `REQUEST_INVALID_CURSOR`
        - `REQUEST_INVALID_PRICE_TYPE`
        - `REQUEST_INVALID_FILTER_COMBINATION`
        - `REQUEST_UNSUPPORTED_MEDIA_TYPE`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            request_invalid:
              value:
                code: 3000
                error_message: REQUEST_INVALID
            request_invalid_parameters:
              value:
                code: 3001
                error_message: REQUEST_INVALID_PARAMETERS
            request_invalid_price:
              value:
                code: 3002
                error_message: REQUEST_INVALID_PRICE
            request_unsupported_media_type:
              value:
                code: 3010
                error_message: REQUEST_UNSUPPORTED_MEDIA_TYPE

    AuthorizationFailed:
      description: |
        Authentication failed.

        Possible public error codes include:
        - `AUTH_INVALID_API_KEY`
        - `AUTH_INVALID_SIGNATURE`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalid_api_key:
              value:
                code: 1000
                error_message: AUTH_INVALID_API_KEY
            invalid_signature:
              value:
                code: 1001
                error_message: AUTH_INVALID_SIGNATURE

    Forbidden:
      description: |
        Operation is not permitted for the authenticated API key, account, source IP,
        or operation scope.

        Possible public error codes include:
        - `AUTH_PERMISSION_DENIED`
        - `ACCOUNT_DISABLED`
        - `ACCOUNT_CLOSE_ONLY`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            permission_denied:
              value:
                code: 1002
                error_message: AUTH_PERMISSION_DENIED
            account_disabled:
              value:
                code: 2001
                error_message: ACCOUNT_DISABLED
            account_close_only:
              value:
                code: 2002
                error_message: ACCOUNT_CLOSE_ONLY

    AccountNotFound:
      description: Account not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            account_not_found:
              value:
                code: 2000
                error_message: ACCOUNT_NOT_FOUND

    Conflict:
      description: |
        State conflict or execution conflict.

        Possible public error codes include:
        - `MARKET_SESSION_CLOSED`
        - `EXECUTION_REQUOTE`
        - `EXECUTION_REJECTED`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            market_session_closed:
              value:
                code: 4003
                error_message: MARKET_SESSION_CLOSED
            execution_requote:
              value:
                code: 6000
                error_message: EXECUTION_REQUOTE
            execution_rejected:
              value:
                code: 6001
                error_message: EXECUTION_REJECTED

    UnprocessableEntity:
      description: |
        Business validation failed.

        Possible public error codes include `TRADING_RULE_*` errors.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalid_volume:
              value:
                code: 5000
                error_message: TRADING_RULE_INVALID_VOLUME
            insufficient_margin:
              value:
                code: 5006
                error_message: TRADING_RULE_INSUFFICIENT_MARGIN

    TooManyRequests:
      description: |
        Public API endpoint quota exceeded.

        `REQUEST_RATE_LIMIT` is non-retryable automatically. Clients should use
        `GET /v1/configuration/accounts/{account_id}/limits` and local request accounting
        to calculate remaining quota before sending more requests.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            request_rate_limit:
              value:
                code: 3015
                error_message: REQUEST_RATE_LIMIT

    ServiceUnavailable:
      description: |
        Service temporarily unavailable.

        Possible public error codes include:
        - `SYSTEM_TEMPORARY_UNAVAILABLE`
        - `MARKET_NO_QUOTES`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            temporary_unavailable:
              value:
                code: 2
                error_message: SYSTEM_TEMPORARY_UNAVAILABLE
            no_quotes:
              value:
                code: 4004
                error_message: MARKET_NO_QUOTES

    InternalServerError:
      description: |
        Internal Server Error

        The server encountered an unexpected condition that prevented it from fulfilling the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internal_error:
              value:
                code: 3
                error_message: SYSTEM_INTERNAL_ERROR

  schemas:
    # ------------------------------------------------------------------
    # Common / shared schemas
    # ------------------------------------------------------------------

    ErrorResponse:
      type: object
      description: |
        Public API business error response.

        `code` is the primary signal for client automation. Public errors are non-retryable by default.

        Rate-limit code semantics:
        - `REQUEST_RATE_LIMIT` is returned for Public API endpoint and tier quota limits.
          It is a synchronous REST `429` error and is non-retryable automatically.
          Clients should use the limits endpoint and local request accounting to calculate remaining quota.
        - `SYSTEM_RATE_LIMIT` is reserved for trading platform throttling mapped from internal
          `ResultTooManyRequests`. It is not used for Public API endpoint quotas and may appear as a final
          asynchronous trading operation error.
      required:
        - code
        - error_message
      properties:
        code:
          $ref: "#/components/schemas/PublicApiErrorCode"
        error_message:
          type: string
          description: Stable public error message in `<CATEGORY>_<REASON>` format.

    PublicApiErrorCode:
      type: integer
      format: int32
      description: |
        Stable public business error code. HTTP status describes the transport/API layer;
        this code is the primary business signal for client automation.

        Public codes currently returned by this API:
        - 1: SYSTEM_RATE_LIMIT
        - 2: SYSTEM_TEMPORARY_UNAVAILABLE
        - 3: SYSTEM_INTERNAL_ERROR
        - 1000: AUTH_INVALID_API_KEY
        - 1001: AUTH_INVALID_SIGNATURE
        - 1002: AUTH_PERMISSION_DENIED
        - 2000: ACCOUNT_NOT_FOUND
        - 2001: ACCOUNT_DISABLED
        - 2002: ACCOUNT_CLOSE_ONLY
        - 3000: REQUEST_INVALID
        - 3001: REQUEST_INVALID_PARAMETERS
        - 3002: REQUEST_INVALID_PRICE
        - 3003: REQUEST_INVALID_TIMEFRAME
        - 3004: REQUEST_INVALID_TIME_RANGE
        - 3005: REQUEST_INVALID_COUNT
        - 3006: REQUEST_INVALID_LIMIT
        - 3007: REQUEST_INVALID_CURSOR
        - 3008: REQUEST_INVALID_PRICE_TYPE
        - 3009: REQUEST_INVALID_FILTER_COMBINATION
        - 3010: REQUEST_UNSUPPORTED_MEDIA_TYPE
        - 3011: REQUEST_METHOD_NOT_ALLOWED
        - 3012: REQUEST_ORDER_NOT_FOUND
        - 3013: REQUEST_POSITION_NOT_FOUND
        - 3014: REQUEST_OPERATION_NOT_FOUND
        - 3015: REQUEST_RATE_LIMIT
        - 4000: MARKET_INSTRUMENT_NOT_FOUND
        - 4001: MARKET_TRADE_DISABLED
        - 4002: MARKET_CLOSE_ONLY
        - 4003: MARKET_SESSION_CLOSED
        - 4004: MARKET_NO_QUOTES
        - 5000: TRADING_RULE_INVALID_VOLUME
        - 5001: TRADING_RULE_VOLUME_TOO_SMALL
        - 5002: TRADING_RULE_VOLUME_TOO_LARGE
        - 5003: TRADING_RULE_INVALID_VOLUME_STEP
        - 5004: TRADING_RULE_INVALID_REMAINING_VOLUME
        - 5005: TRADING_RULE_INVALID_PRICE_LEVELS
        - 5006: TRADING_RULE_INSUFFICIENT_MARGIN
        - 5007: TRADING_RULE_MARGIN_LEVEL_TOO_LOW
        - 5008: TRADING_RULE_OPERATION_RESTRICTED
        - 5009: TRADING_RULE_TOO_MANY_PENDING_ORDERS
        - 5010: TRADING_RULE_TOO_MANY_OPEN_POSITIONS
        - 6000: EXECUTION_REQUOTE
        - 6001: EXECUTION_REJECTED
      enum:
        - 1
        - 2
        - 3
        - 1000
        - 1001
        - 1002
        - 2000
        - 2001
        - 2002
        - 3000
        - 3001
        - 3002
        - 3003
        - 3004
        - 3005
        - 3006
        - 3007
        - 3008
        - 3009
        - 3010
        - 3011
        - 3012
        - 3013
        - 3014
        - 3015
        - 4000
        - 4001
        - 4002
        - 4003
        - 4004
        - 5000
        - 5001
        - 5002
        - 5003
        - 5004
        - 5005
        - 5006
        - 5007
        - 5008
        - 5009
        - 5010
        - 6000
        - 6001

    WsErrorResponse:
      type: object
      description: WebSocket error response.
      required:
        - id
        - code
        - error_message
      properties:
        id:
          type: string
          description: Client request identifier
          example: "a95b3221-7392-4766-b71e-95318c7580f1"
        code:
          $ref: "#/components/schemas/PublicApiErrorCode"
        error_message:
          type: string
          description: Stable public error message in `<CATEGORY>_<REASON>` format.

    Money:
      type: object
      description: Monetary value.
      properties:
        amount:
          $ref: "#/components/schemas/DecimalString"
          description: Monetary amount represented as a decimal string.
          example: "3.50"
        currency:
          type: string
          example: USD
          description: Currency code (e.g., USD, EUR)

    DecimalString:
      type: string
      description: |
       Decimal numeric value represented as a string to avoid precision loss.
       The value must contain a valid decimal number in plain dot notation without thousand separators or scientific notation.
      pattern: '^[+-]?[0-9]+(?:\.[0-9]+)?$'
      example: "1.08340"

    UInt64String:
      type: string
      description: |
        Unsigned 64-bit integer value serialized as a decimal string.
        The value must contain from 1 to 20 decimal digits and must not include a sign or separators.
      minLength: 1
      maxLength: 20
      pattern: '^[0-9]{1,20}$'
      example: "152706877"

    InstrumentName:
      type: string
      description: Instrument symbolic identifier.
      minLength: 1
      maxLength: 11
      pattern: '^[A-Za-z0-9._-]+$'
      example: "EURUSD"

    PositiveDecimalString:
      type: string
      description: |
        Positive decimal numeric value represented as a string to avoid precision loss.
        The value must contain a valid decimal number in plain dot notation without thousand separators or scientific notation.
        Zero values such as `0`, `0.0`, and `0.00` are not allowed.
      pattern: '^[+]?(?:(?:0*[1-9][0-9]*)(?:\.[0-9]+)?|0+\.[0-9]*[1-9][0-9]*)$'
      example: "0.01"

    ClosePositionVolumeString:
      type: string
      description: |
        Decimal close volume represented as a string to avoid precision loss.
        The value must contain a valid decimal number in plain dot notation without thousand separators or scientific notation.
        Zero values such as `0`, `0.0`, and `0.00` are allowed only when `close_by_position_id` is provided.
      pattern: '^[+]?[0-9]+(?:\.[0-9]+)?$'
      example: "0.01"

    InstrumentVolumeString:
      allOf:
        - $ref: "#/components/schemas/PositiveDecimalString"
      description: |
        Decimal trading volume represented as a string.
        Instrument-specific validation inputs are provided by `GET /v1/configuration/accounts/{account_id}/instruments/{instrument}/conditions`:
        - minimum volume: `volume_min`
        - maximum volume: `volume_max`
        - step: `volume_step`

        For new positions and new pending orders, the requested value must satisfy:
        - `volume > 0`
        - `volume >= volume_min`
        - `volume <= volume_max`
        - `(volume - volume_min)` must be a multiple of `volume_step`
      example: "0.01"

    InstrumentPriceString:
      allOf:
        - $ref: "#/components/schemas/PositiveDecimalString"
      description: |
        Decimal instrument price represented as a string.
        Instrument-specific precision is provided by `GET /v1/configuration/accounts/{account_id}/instruments/{instrument}/conditions`:
        - `price > 0`
        - maximum fractional digits: `point_digits`
        - implied minimum price increment: `10^-point_digits`

        Request price values must not contain more fractional digits than `point_digits`.
        Additional business rules such as stop levels, execution mode, and market-side checks may also apply.
      example: "1.08340"

    # ------------------------------------------------------------------
    # Reference enums
    # ------------------------------------------------------------------

    TradingSubscriptionType:
      type: string
      enum:
        - transactions
        - account_state
        - instruments

    TradingEventType:
      type: string
      enum:
        - trading_state_snapshot
        - transaction_event
        - account_state_event
        - instrument_event

    InstrumentEventAction:
      type: string
      description: >
        Lifecycle action derived from instrument configuration changes. This is a
        transport-level marker: `new` for newly added instrument configuration,
        `upd` for changed configuration, and `del` for removed configuration.
      enum:
        - new
        - upd
        - del

    TradingEventStatus:
      type: string
      description: |
        Public status of a transaction event.

        `success` means a finalized account or trading state change was produced.
        `rejected` and `failed` describe unsuccessful processing result.
      enum:
        - success
        - failed
        - rejected

    AccountTradingStatus:
      type: string
      description: |
        Restrictions on actions related to trading entities
        Values:
        - active: opening, modifying and closing trades is allowed
        - close_only: only closing positions and cancelling orders is allowed
      enum:
        - active
        - close_only

    ExecutionMode:
      type: string
      description: Order execution mode.
      enum:
        - undefined
        - instant
        - market

    CalculationMode:
      type: string
      enum:
        - undefined
        - forex
        - forex_no_leverage
        - cfd
        - cfd_leverage

    TradeMode:
      type: string
      description: |
       Account status for trading
       Values:
       - enabled: the account is available for trading
       - trading_disabled: trading operations and trading-related realtime streams are disabled; configuration remains available.
      enum:
        - enabled
        - trading_disabled

    InstrumentOrderType:
      type: string
      enum:
        - stop
        - limit
        - stoplimit
        - market

    FillingMode:
      type: string
      enum:
        - fok
        - ioc
        - boc

    CommissionType:
      type: string
      enum:
        - undefined
        - per_lot_per_side
        - per_lot_per_trade
        - per_million_usd

    OrderReason:
      type: string
      description: |
       Technical platform reason code
      enum:
        - undefined
        - sl
        - tp
        - so
        - margin_check_failed
        - dealer
        - close_by
        - stock_split
        - trading_server

    # ------------------------------------------------------------------
    # Market data schemas (Candles/Ticks)
    # ------------------------------------------------------------------

    Candle:
      type: object
      description: Historical candle record (single price type - bid or ask).
      properties:
        time:
          type: string
          format: date-time
          description: Candle open time
        open:
          type: number
          format: double
          description: Open price
        high:
          type: number
          format: double
          description: High price
        low:
          type: number
          format: double
          description: Low price
        close:
          type: number
          format: double
          description: Close price
        volume:
          type: number
          format: double
          description: Candle volume

    CandleHistoryResponse:
      type: object
      description: Candle history response.
      properties:
        candles:
          type: array
          description: List of candles. Format depends on `price_type` query parameter.
          items:
            oneOf:
              - $ref: "#/components/schemas/Candle"
              - $ref: "#/components/schemas/CandleBidAsk"

    CandleBidAsk:
      type: object
      description: Candle containing both bid and ask prices (when `price_type=both`).
      properties:
        time:
          type: string
          format: date-time
          description: Candle open time
        bid:
          $ref: "#/components/schemas/CandleSide"
        ask:
          $ref: "#/components/schemas/CandleSide"
        volume:
          type: number
          format: double
          description: Candle volume

    CandleSide:
      type: object
      description: OHLC candle side (bid or ask).
      properties:
        open:
          type: number
          format: double
          description: Open price
        high:
          type: number
          format: double
          description: High price
        low:
          type: number
          format: double
          description: Low price
        close:
          type: number
          format: double
          description: Close price

    WSTick:
      type: object
      description: Real-time tick event for subscription.
      properties:
        instrument:
          $ref: "#/components/schemas/InstrumentName"
        bid:
          type: number
          format: double
          description: Bid price
        ask:
          type: number
          format: double
          description: Ask price
        timestamp:
          type: string
          format: date-time
          description: Tick timestamp

    # ------------------------------------------------------------------
    # Trading domain models (Order, Position, Deal)
    # ------------------------------------------------------------------

    AccountState:
      type: object
      description: |
       Current account monetary state.
       All monetary values are expressed in the account currency.
       Account monetary values are rounded according to the decimal precision of the account currency.
       Examples with 2 decimal places assume an account currency that uses 2 decimal places.
      required:
        - balance
        - equity
        - used_margin
      properties:
        balance:
          $ref: "#/components/schemas/DecimalString"
          description: |
            Account balance. Includes only realized results and posted balance operations.
            Rounded according to the decimal precision of the account currency.
        equity:
          $ref: "#/components/schemas/DecimalString"
          description: |
            Account equity. Formula: `equity = balance + unrealized_PNL`
            Rounded according to the decimal precision of the account currency.
          x-formula: "equity = balance + unrealized_PNL"
        used_margin:
          $ref: "#/components/schemas/DecimalString"
          description: |
            Margin currently used to maintain open positions.
            Rounded according to the decimal precision of the account currency.
            Related metric: `free_margin = equity - used_margin`

    Order:
      type: object
      description: |
        Public order representation.
        For `order_type=sltp`, some trading fields such as `direction`, `instrument`, `price`, and `volume` may be omitted if they are inherited from the related position.
        When a pending order is placed with SL/TP, the main pending order and the related SLTP order may both be included as changed entities in the same `transaction_event`.
      required:
        - order_id
        - order_type
        - state
        - create_time
      properties:
        order_id:
          allOf:
            - $ref: "#/components/schemas/UInt64String"
          description: Order identifier
        position_id:
          allOf:
            - $ref: "#/components/schemas/UInt64String"
          description: Related position identifier, if this order is linked to a position.
        order_type:
          type: string
          description: Public order type
          enum:
            - market
            - stop
            - limit
            - sltp
        state:
          type: string
          description: |
             Order state

             Possible states:
             - placed = active pending order
             - filled = executed order
             - cancelled = cancelled before execution
             - rejected = rejected by platform
          enum:
            - pending_new
            - placed
            - filled
            - cancelled
            - rejected
        direction:
          type: string
          description: Order direction
          enum:
            - buy
            - sell
        instrument:
          $ref: "#/components/schemas/InstrumentName"
        price:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          description: Order price
        stop_loss_price:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          nullable: true
          description: Stop loss price
        take_profit_price:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          nullable: true
          description: Take profit price
        create_time:
          type: string
          format: date-time
          description: Order creation time
        update_time:
          type: string
          format: date-time
          description: Last order update time
        volume:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          description: Order volume
        reason:
          $ref: "#/components/schemas/OrderReason"

    Position:
      type: object
      description: Public position representation.
      required:
        - position_id
        - direction
        - instrument
        - state
        - create_time
        - volume
      properties:
        position_id:
          allOf:
            - $ref: "#/components/schemas/UInt64String"
          description: Position identifier
        direction:
          type: string
          description: Position direction
          enum:
            - buy
            - sell
        instrument:
          $ref: "#/components/schemas/InstrumentName"
        initial_volume:
          $ref: "#/components/schemas/DecimalString"
          description: Initial position volume
        volume:
          $ref: "#/components/schemas/DecimalString"
          description: Remaining position volume
        open_price:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          description: Position open price
        state:
          type: string
          description: Position state
          enum:
            - open
            - closed
        margin_rate:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          description: Margin rate
        create_time:
          type: string
          format: date-time
          description: Position creation time
        commission:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          description: Accumulated commission
        swap:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          description: Accumulated swap
        rollover_time:
          type: string
          format: date-time
          description: Last rollover time

    ProfitAmount:
      type: object
      description: Profit amount structure.
      properties:
        amount:
          $ref: "#/components/schemas/DecimalString"
          description: Profit amount value
        currency:
          type: string
          description: Profit amount currency

    Deal:
      type: object
      description: Public deal representation.
      required:
        - deal_id
        - type
        - create_time
      properties:
        deal_id:
          allOf:
            - $ref: "#/components/schemas/UInt64String"
          description: Deal identifier
        order_id:
          allOf:
            - $ref: "#/components/schemas/UInt64String"
          description:  Related order identifier, if the deal was created as a result of an order execution.
        position_id:
          allOf:
            - $ref: "#/components/schemas/UInt64String"
          description: Related position identifier, if this deal is linked to a position.
        type:
          type: string
          description: Deal type
          enum:
            - open
            - close
            - balance
            - null_compensation
            - swap_fee
            - admin_fee
            - dividend
            - exness_dollar
        direction:
          type: string
          description: |
            Direction of trade-related deals.
            Not applicable for balance-type deals.
          enum:
            - buy
            - sell
        instrument:
          $ref: "#/components/schemas/InstrumentName"
        volume:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          description: Deal volume
        price:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          description: Deal price
        profit:
          $ref: "#/components/schemas/ProfitAmount"
        create_time:
          type: string
          format: date-time
          description: Deal creation time
        commission:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          description: Deal commission


    # ------------------------------------------------------------------
    # Trading Requests
    # ------------------------------------------------------------------

    OpenPositionRequest:
      type: object
      description: |
        Open position request using immediate market execution.
      required:
        - instrument
        - side
        - volume
      properties:
        instrument:
          $ref: "#/components/schemas/InstrumentName"
        side:
          type: string
          description: Position direction
          enum:
            - buy
            - sell
        volume:
          $ref: "#/components/schemas/InstrumentVolumeString"
          description: Requested position volume
        price:
          $ref: "#/components/schemas/InstrumentPriceString"
          description: |
            Requested execution price.
            Required when instrument `exec_mode` is `instant`.
            Not applicable for `market` execution and will be ignored.
        deviation:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          description: |
            Optional maximum allowed price deviation for execution, expressed in points.
            Applicable only when `exec_mode` is `instant` and `price` is provided.
            If the execution price differs from the requested price within the deviation, the order may be executed at the new price without requote; if the difference exceeds it, the request may be rejected with requote.
            If omitted, instant execution requires execution at the exact requested price or may result in requote.
        stop_loss_price:
          $ref: "#/components/schemas/InstrumentPriceString"
          description: Optional Stop Loss price. Omit to open the position without Stop Loss.
        take_profit_price:
          $ref: "#/components/schemas/InstrumentPriceString"
          description: Optional Take Profit price. Omit to open the position without Take Profit.
        comment:
          type: string
          description: Optional client comment

    NewPendingOrderRequest:
      oneOf:
        - $ref: "#/components/schemas/NewLimitOrderRequest"
        - $ref: "#/components/schemas/NewStopOrderRequest"
        - $ref: "#/components/schemas/NewSltpOrderRequest"

    NewLimitOrderRequest:
      type: object
      description: |
        New limit order request.
        If `stop_loss_price` or `take_profit_price` is provided, the resulting `transaction_event` may include the main limit order and a related SLTP order.
      required:
        - instrument
        - side
        - type
        - volume
        - price
      properties:
        instrument:
          $ref: "#/components/schemas/InstrumentName"
        side:
          type: string
          description: Order direction
          enum:
            - buy
            - sell
        type:
          type: string
          enum:
            - limit
        volume:
          $ref: "#/components/schemas/InstrumentVolumeString"
          description: Requested order volume
        price:
          $ref: "#/components/schemas/InstrumentPriceString"
          description: Requested limit order price
        stop_loss_price:
          $ref: "#/components/schemas/InstrumentPriceString"
          description: Optional Stop Loss price. Omit to create the order without Stop Loss.
        take_profit_price:
          $ref: "#/components/schemas/InstrumentPriceString"
          description: Optional Take Profit price. Omit to create the order without Take Profit.
        comment:
          type: string
          description: Optional client comment

    NewStopOrderRequest:
      type: object
      description: |
        New stop order request.
        If `stop_loss_price` or `take_profit_price` is provided, the resulting `transaction_event` may include the main stop order and a related SLTP order.
      required:
        - instrument
        - side
        - type
        - volume
        - price
      properties:
        instrument:
          $ref: "#/components/schemas/InstrumentName"
        side:
          type: string
          description: Order direction
          enum:
            - buy
            - sell
        type:
          type: string
          enum:
            - stop
        volume:
          $ref: "#/components/schemas/InstrumentVolumeString"
          description: Requested order volume
        price:
          $ref: "#/components/schemas/InstrumentPriceString"
          description: Requested stop order price
        stop_loss_price:
          $ref: "#/components/schemas/InstrumentPriceString"
          description: Optional Stop Loss price. Omit to create the order without Stop Loss.
        take_profit_price:
          $ref: "#/components/schemas/InstrumentPriceString"
          description: Optional Take Profit price. Omit to create the order without Take Profit.
        comment:
          type: string
          description: Optional client comment

    NewSltpOrderRequest:
      type: object
      description: |
        New SLTP order request.
        `position_id` identifies the position to which SLTP is attached.
      required:
        - position_id
        - type
      properties:
        position_id:
          allOf:
            - $ref: "#/components/schemas/UInt64String"
          description: Position to which SLTP is attached.
        type:
          type: string
          enum:
            - sltp
        stop_loss_price:
          $ref: "#/components/schemas/InstrumentPriceString"
          description: Stop Loss price. At least one of stop_loss_price or take_profit_price must be provided.
        take_profit_price:
          $ref: "#/components/schemas/InstrumentPriceString"
          description: Take Profit price. At least one of stop_loss_price or take_profit_price must be provided.
        comment:
          type: string
          description: Optional client comment
      anyOf:
        - required: [stop_loss_price]
        - required: [take_profit_price]

    ModifyOrderRequest:
      type: object
      description: |
        Modify active order request.

        At least one of the following fields must be provided: `price`, `stop_loss_price`, `take_profit_price`.
        Omitted fields are not changed.
        Use `null` for `stop_loss_price` or `take_profit_price` to remove the corresponding SL/TP value.
      properties:
        price:
          $ref: "#/components/schemas/InstrumentPriceString"
          description: Updated order price
        stop_loss_price:
          allOf:
            - $ref: "#/components/schemas/InstrumentPriceString"
          nullable: true
          description: Updated Stop Loss price. Use `null` to remove Stop Loss.
        take_profit_price:
          allOf:
            - $ref: "#/components/schemas/InstrumentPriceString"
          nullable: true
          description: Updated Take Profit price. Use `null` to remove Take Profit.
        comment:
          type: string
          description: Optional client comment
      anyOf:
        - required: [price]
        - required: [stop_loss_price]
        - required: [take_profit_price]

    # ------------------------------------------------------------------
    # History / snapshot responses
    # ------------------------------------------------------------------

    OperationStatusResponse:
      type: object
      required:
        - operation_id
        - status
        - created_at
        - updated_at
      properties:
        operation_id:
          allOf:
            - $ref: "#/components/schemas/UInt64String"
          description: Operation identifier
        status:
          type: string
          enum: [pending, confirmed, rejected, failed]
          description: Current operation status
        client_request_id:
          type: string
          description: Client-provided idempotency identifier, if supplied. Signed requests use `EXN-IDEMPOTENCY-KEY`.
        error_code:
          $ref: "#/components/schemas/PublicApiErrorCode"
          description: Public business error code when status is `rejected` or `failed`.
        error_message:
          type: string
          description: Stable public error message when status is `rejected` or `failed`.
          example: TRADING_RULE_INVALID_PRICE_LEVELS
        created_at:
          type: string
          format: date-time
          description: Time the operation was accepted
        updated_at:
          type: string
          format: date-time
          description: Time the operation status was last updated

    AckResponse:
      type: object
      description: Acknowledgement response for asynchronously processed trading requests.
      required:
        - status
      properties:
        operation_id:
          allOf:
            - $ref: "#/components/schemas/UInt64String"
          description: Unique request identifier used for correlation and idempotency.
        client_request_id:
          type: string
          description: Echoed client-provided idempotency identifier, if supplied. Signed requests use `EXN-IDEMPOTENCY-KEY`.
        status:
          type: string
          description: Processing acknowledgement status
          enum: [accepted]

    AccountDetailsResponse:
      type: object
      description: Account details response.
      required:
        - account_id
        - create_date
      properties:
        account_id:
          allOf:
            - $ref: "#/components/schemas/UInt64String"
          description: Account identifier
          example: "152706877"
        account_name:
          type: string
          description: Account name
          example: Standard
        create_date:
          type: string
          format: date-time
          description: Account creation date
          example: "2024-03-14T11:46:30+00:00"
        settings:
          $ref: "#/components/schemas/AccountSettings"

    OrdersHistoryResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: Historical order records sorted by event_time in ascending order.
          items:
            $ref: "#/components/schemas/OrderHistoryItem"
        next_cursor:
          type: string
          description: Opaque token for pagination. Omitted when there are no more items.
        has_more:
          type: boolean
        range:
          type: object
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time

    OrderHistoryItem:
      type: object
      description: |
         Historical order item.
      required:
        - event_time
        - order
      properties:
        event_time:
          type: string
          format: date-time
          description: Time used for sorting and pagination.
        order:
          $ref: "#/components/schemas/Order"

    DealsHistoryResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: Historical deal records sorted by event_time in ascending order.
          items:
            $ref: "#/components/schemas/DealHistoryItem"
        next_cursor:
          type: string
          description: Opaque token for pagination. Omitted when there are no more items.
        has_more:
          type: boolean
        range:
          type: object
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time

    DealHistoryItem:
      type: object
      description: |
         Historical deal item.
      required:
        - event_time
        - deal
      properties:
        event_time:
          type: string
          format: date-time
          description: Time used for sorting and pagination.
        deal:
          $ref: "#/components/schemas/Deal"

    InstrumentNameListResponse:
      type: object
      description: Response containing only names of available instruments.
      properties:
        instruments:
          type: array
          description: List of instrument names
          items:
            $ref: "#/components/schemas/InstrumentName"

    InstrumentConditionResponse:
      type: object
      description: |
        Detailed trading conditions for a single instrument.
        Optional properties in this response are omitted when the corresponding value is not available.
      required:
        - instrument
      properties:
        instrument:
          allOf:
            - $ref: "#/components/schemas/InstrumentName"
          description: Instrument identifier.
          example: EURUSD
        description:
          type: string
          example: Euro vs US Dollar
        international_name:
          type: string
          nullable: true
          example: EUR/USD
        category:
          type: string
          example: Forex
        base_currency:
          type: string
          example: EUR
        quote_currency:
          type: string
          example: USD
        margin_currency:
          type: string
          example: EUR
        point_digits:
          type: integer
          format: int32
          description: |
            Number of decimal digits allowed after the point for instrument prices.
            Request price fields (`price`, `stop_loss_price`, `take_profit_price`) must not use more fractional digits than this value.
            The implied minimum price increment is `10^-point_digits`.
          example: 5
        calc_mode:
          $ref: "#/components/schemas/CalculationMode"
        exec_mode:
          $ref: "#/components/schemas/ExecutionMode"
        margin_percent:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          nullable: true
          example: "1"
        contract_size:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          nullable: true
          description: Contract size represented as a decimal string.
          example: "100000"
        volume_min:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          nullable: true
          description: |
            Minimum tradable volume represented as a decimal string.
            Use together with `volume_max` and `volume_step` to validate `volume` in position-open and pending-order requests.
          example: "0.01"
        volume_max:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          nullable: true
          description: |
            Maximum tradable volume represented as a decimal string.
            Use together with `volume_min` and `volume_step` to validate `volume` in position-open and pending-order requests.
          example: "200"
        volume_step:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          nullable: true
          description: |
            Volume increment represented as a decimal string.
            Valid request volumes must align to this step from `volume_min`.
          example: "0.01"
        swap_long:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          nullable: true
          example: "-6.35"
        swap_short:
          allOf:
            - $ref: "#/components/schemas/DecimalString"
          nullable: true
          example: "2.14"
        swap_multipliers:
          type: array
          items:
            $ref: "#/components/schemas/SwapMultiplier"
        trade_mode:
          $ref: "#/components/schemas/TradeMode"
        order_types:
          type: array
          items:
            $ref: "#/components/schemas/InstrumentOrderType"
        filling_modes:
          type: array
          items:
            $ref: "#/components/schemas/FillingMode"
        trade_sessions:
          type: array
          items:
            $ref: "#/components/schemas/InstrumentSession"
        commission_settings:
          $ref: "#/components/schemas/CommissionSettings"

    LimitsResponse:
      type: object
      additionalProperties: false
      description: Effective REST and WebSocket limits for the account.
      required:
        - limits
      properties:
        limits:
          $ref: "#/components/schemas/ApiLimits"

    ApiLimits:
      type: object
      additionalProperties: false
      required:
        - rest
        - websocket
      properties:
        rest:
          $ref: "#/components/schemas/RestLimits"
        websocket:
          $ref: "#/components/schemas/WebSocketLimits"

    RestLimits:
      type: object
      additionalProperties: false
      description: REST limits. Reported rates cover the complete AP cluster.
      required:
        - global_account_rate
        - methods
      properties:
        global_account_rate:
          $ref: "#/components/schemas/GlobalRestRateLimit"
        methods:
          type: array
          description: Effective limit and static OpenAPI metadata for every REST operation.
          items:
            $ref: "#/components/schemas/RestMethodLimits"

    GlobalRestRateLimit:
      type: object
      additionalProperties: false
      required:
        - limit
        - window_seconds
      properties:
        limit:
          type: integer
          minimum: 1
          description: Maximum requests allowed during the window across the AP cluster.
        window_seconds:
          type: integer
          minimum: 1
          description: Rate-limit window duration in seconds.

    ApiRateLimit:
      type: object
      additionalProperties: false
      required:
        - limit
        - window_seconds
      properties:
        limit:
          type: integer
          minimum: 1
          description: Maximum operations allowed during the window.
        window_seconds:
          type: integer
          minimum: 1
          description: Rate-limit window duration in seconds.

    RestMethodLimits:
      type: object
      additionalProperties: false
      required:
        - api_operation_id
        - http_method
        - path
        - rate_limit
      properties:
        api_operation_id:
          type: string
          description: Exact OpenAPI operationId used as the rate-limit configuration key.
        http_method:
          $ref: "#/components/schemas/HttpMethod"
        path:
          type: string
          description: OpenAPI path template.
        rate_limit:
          $ref: "#/components/schemas/ApiRateLimit"
        limits:
          $ref: "#/components/schemas/OperationRequestLimits"

    HttpMethod:
      type: string
      description: Uppercase HTTP request method from the OpenAPI operation.
      enum: [GET, POST, PUT, PATCH, DELETE]

    OperationRequestLimits:
      type: object
      additionalProperties: false
      description: Request-shape limits applicable to an individual REST operation.
      properties:
        max_candles_per_request:
          type: integer
          minimum: 1
          description: Maximum number of candles accepted by one request.
        max_candles_per_request_description:
          type: string
          description: Human-readable explanation of the candle request limit.
        history_range_days:
          type: integer
          minimum: 1
          description: Maximum duration of a requested history range in days.
        history_age_days:
          type: integer
          minimum: 1
          description: Maximum age of requested history in days.

    WebSocketLimits:
      type: object
      additionalProperties: false
      description: Global WebSocket protection and limits for individual stream endpoints.
      required:
        - global_account_limits
        - endpoints
      properties:
        global_account_limits:
          $ref: "#/components/schemas/WebSocketGlobalAccountLimits"
        endpoints:
          type: array
          description: Effective per-endpoint limits and static OpenAPI metadata.
          items:
            $ref: "#/components/schemas/WebSocketEndpointLimits"

    WebSocketGlobalAccountLimits:
      type: object
      additionalProperties: false
      description: WebSocket limits shared by every stream endpoint for an account on one server node.
      required:
        - max_active_connections
        - max_inbound_message_bytes
        - connection_rate
        - inbound_message_rate
        - strikes
      properties:
        max_active_connections:
          type: integer
          minimum: 1
          description: Maximum concurrently active WebSocket connections.
        max_inbound_message_bytes:
          type: integer
          minimum: 1
          description: Maximum accepted size of one inbound client message, in bytes.
        connection_rate:
          $ref: "#/components/schemas/WebSocketTokenBucketLimit"
        inbound_message_rate:
          $ref: "#/components/schemas/WebSocketTokenBucketLimit"
        strikes:
          $ref: "#/components/schemas/WebSocketStrikeLimits"

    WebSocketEndpointLimits:
      type: object
      additionalProperties: false
      description: Limits independently enforced for a WebSocket stream endpoint on one server node.
      required:
        - api_operation_id
        - http_method
        - path
        - connection_rate
        - inbound_message_rate
        - subscription_operation_rate
      properties:
        api_operation_id:
          type: string
          description: Exact OpenAPI operationId used as the endpoint configuration key.
        http_method:
          $ref: "#/components/schemas/HttpMethod"
        path:
          type: string
          description: OpenAPI path template.
        connection_rate:
          $ref: "#/components/schemas/WebSocketTokenBucketLimit"
        inbound_message_rate:
          $ref: "#/components/schemas/WebSocketTokenBucketLimit"
        subscription_operation_rate:
          type: object
          description: >
            Per-subscription-type subscribe limits applicable to this endpoint. Unsubscribe operations
            remain subject only to inbound-message limits.
          additionalProperties:
            $ref: "#/components/schemas/WebSocketTokenBucketLimit"

    WebSocketTokenBucketLimit:
      type: object
      additionalProperties: false
      description: Token-bucket rate enforced per account on one server node.
      required:
        - limit
        - window_seconds
        - burst
      properties:
        limit:
          type: integer
          minimum: 1
          description: Tokens refilled during each window.
        window_seconds:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Refill window duration in seconds.
        burst:
          type: integer
          minimum: 1
          description: Maximum token-bucket capacity.

    WebSocketStrikeLimits:
      type: object
      additionalProperties: false
      description: Abuse strike budget shared across WebSocket endpoints on one server node.
      required:
        - refill_amount
        - threshold
        - period_ms
      properties:
        refill_amount:
          type: integer
          minimum: 1
          description: Number of strikes forgiven per decay interval.
        threshold:
          type: integer
          minimum: 1
          description: Number of strikes tolerated before the connection is terminated.
        period_ms:
          type: integer
          minimum: 1
          description: Strike decay interval in milliseconds.

    # ------------------------------------------------------------------
    # Streaming / WS schemas
    # ------------------------------------------------------------------

    WSEventsCommandRequestData:
      oneOf:
        - $ref: "#/components/schemas/WSEventsSubscribeRequestData"
        - $ref: "#/components/schemas/WSEventsUnsubscribeRequestData"

    WSEventsSubscribeRequestData:
      type: object
      description: Subscription request for trading event stream.
      required:
        - id
        - subscribe
      properties:
        id:
          type: string
          description: Client-generated subscription request identifier.
        subscribe:
          $ref: "#/components/schemas/TradingEventsSubscription"

    WSEventsUnsubscribeRequestData:
      type: object
      description: |
        Unsubscription request for trading event stream.

        For `instruments`, the `instruments` field contains the instruments to remove from the
        active subscription. Use exactly `["all"]` to unsubscribe from all instrument updates.

        For `hmr`, the `instruments` field contains the instruments to remove from the active HMR
        subscription. Instruments that are not currently subscribed are ignored; the request is not
        validated against account availability and is not rejected for unknown instruments.
      required:
        - id
        - unsubscribe
      properties:
        id:
          type: string
          description: Client-generated unsubscription request identifier.
        unsubscribe:
          $ref: "#/components/schemas/TradingEventsSubscription"

    TradingEventsSubscription:
      oneOf:
        - $ref: "#/components/schemas/TradingTransactionsSubscription"
        - $ref: "#/components/schemas/TradingAccountStateSubscription"
        - $ref: "#/components/schemas/TradingInstrumentsSubscription"
        - $ref: "#/components/schemas/TradingHmrSubscription"

    TradingTransactionsSubscription:
      type: object
      required:
        - event
      properties:
        event:
          type: string
          enum:
            - transactions

    TradingAccountStateSubscription:
      type: object
      required:
        - event
      properties:
        event:
          type: string
          enum:
            - account_state

    TradingHmrSubscription:
      type: object
      required:
        - event
        - instruments
      properties:
        event:
          type: string
          enum:
            - hmr
        instruments:
          type: array
          minItems: 1
          description: >
            Explicit list of instrument names to receive HMR period events for. Requested instruments
            must be available for the selected account.
          items:
            $ref: "#/components/schemas/InstrumentName"

    TradingInstrumentsSubscription:
      type: object
      required:
        - event
        - instruments
      properties:
        event:
          type: string
          enum:
            - instruments
        instruments:
          type: array
          minItems: 1
          description: >
            List of instrument names to subscribe to. Requested instruments must be available
            for the selected account. Use exactly `["all"]` to subscribe to all instrument
            updates available for the selected account. Do not combine `all` with specific
            instrument names.
          items:
            $ref: "#/components/schemas/InstrumentName"

    WSTicksSubscribeRequestData:
      type: object
      description: Subscription request for tick stream.
      required:
        - id
        - subscribe
      properties:
        id:
          type: string
          description: Client-generated subscription request identifier
        subscribe:
          type: object
          required:
            - event
            - instruments
          description: Subscription payload
          properties:
            event:
              type: string
              description: Event type to subscribe to
              enum:
                - ticks
            instruments:
              type: array
              description: List of instruments
              items:
                $ref: "#/components/schemas/InstrumentName"

    AccountStateEventPayload:
      type: object
      description: |
        Periodic account floating state payload.

        In the current version, this payload is used for equity monitoring.
        It contains the current account_state snapshot after account floating state recalculation.

        Balance operations and trading transactions are not delivered through this event type.
        They are delivered through `transaction_event`.
      required:
        - account_state
      properties:
        account_state:
          $ref: "#/components/schemas/AccountState"

    TradingStateSnapshot:
      type: object
      description: |
        Current trading state snapshot for the account.

        This payload is returned by the REST trading state endpoint and is also
        delivered immediately after subscribing to the transactions stream.
      required:
        - account_state
      properties:
        orders:
          type: array
          description: Currently active orders for the account.
          items:
            $ref: "#/components/schemas/Order"
        positions:
          type: array
          description: Currently open positions for the account.
          items:
            $ref: "#/components/schemas/Position"
        account_state:
          $ref: "#/components/schemas/AccountState"

    TransactionAccountState:
      allOf:
        - $ref: "#/components/schemas/AccountState"
        - type: object
          description: Account state as delivered in transaction events.
          required:
            - leverage
          properties:
            leverage:
              type: string
              description: Account leverage.

    TransactionPayload:
      type: object
      description: |
       Finalized transaction payload delivered through the transaction event stream.

       Transaction is a meta-entity. It does not have its own transaction identifier.
       It groups order, deal, position and account_state changes that belong to the same finalized event.

       The payload contains only entities created or changed as a result of this concrete transaction.

       Payload composition defines the transaction meaning:
       - trading transaction: contains changed orders, deals and/or positions
       - non-trading balance transaction: contains a balance-type deal and account_state

       Operation correlation fields are placed at the event envelope level as `operation_id` and `client_request_id`.

       The payload contains only entities created or changed as a result of this concrete transaction. It must not contain all historically related entities.
      properties:
        orders:
          type: array
          description: Orders created or changed by this transaction.
          items:
           $ref: "#/components/schemas/Order"
        positions:
          type: array
          description: Positions created or changed by this transaction.
          items:
           $ref: "#/components/schemas/Position"
        deals:
          type: array
          description: Deals created by this transaction, including trading and balance deals.
          items:
           $ref: "#/components/schemas/Deal"
        account_state:
          $ref: "#/components/schemas/TransactionAccountState"

    WSTradingEvent:
      oneOf:
        - $ref: "#/components/schemas/WSTradingStateSnapshotEvent"
        - $ref: "#/components/schemas/WSTradingTransactionEvent"
        - $ref: "#/components/schemas/WSAccountStateEvent"
        - $ref: "#/components/schemas/WSInstrumentEvent"
        - $ref: "#/components/schemas/WSHmrSnapshotEvent"
        - $ref: "#/components/schemas/WSHmrUpdateEvent"
      discriminator:
        propertyName: event_type
        mapping:
          trading_state_snapshot: "#/components/schemas/WSTradingStateSnapshotEvent"
          transaction_event: "#/components/schemas/WSTradingTransactionEvent"
          account_state_event: "#/components/schemas/WSAccountStateEvent"
          instrument_event: "#/components/schemas/WSInstrumentEvent"
          hmr_snapshot: "#/components/schemas/WSHmrSnapshotEvent"
          hmr_update: "#/components/schemas/WSHmrUpdateEvent"

    WSTradingStateSnapshotEvent:
      type: object
      description: Trading streaming event envelope for the initial trading state snapshot.
      required:
        - event_type
        - payload
      properties:
        event_type:
          type: string
          enum:
            - trading_state_snapshot
        payload:
          $ref: "#/components/schemas/TradingStateSnapshot"

    WSTradingTransactionEvent:
      type: object
      description: |
        Trading streaming event envelope for finalized transactions and processing results.

        Trading snapshot may represent active SL/TP values directly on the related pending order,
        while `transaction_event` may include a separate SLTP order as one of the changed entities.
      required:
        - event_type
        - payload
      properties:
        event_type:
          type: string
          enum:
            - transaction_event
        operation_id:
          allOf:
            - $ref: "#/components/schemas/UInt64String"
          description: |
            Concrete operation identifier associated with this transaction event.
            Omitted when absent, including for system-generated updates and non-trading balance transactions.
        client_request_id:
          type: string
          nullable: true
          description: |
            Client-provided idempotency identifier, if supplied.
            Signed requests use `EXN-IDEMPOTENCY-KEY`.
            Allows correlating transaction events with originating REST requests without
            storing the `operation_id` mapping on the client side.
        status:
          $ref: "#/components/schemas/TradingEventStatus"
        error_code:
          $ref: "#/components/schemas/PublicApiErrorCode"
          description: Business error code for rejected or failed processing results.
        error_message:
          type: string
          description: Stable public error message for rejected or failed processing results.
          example: TRADING_RULE_INSUFFICIENT_MARGIN
        event_time:
          type: string
          format: date-time
          description: Time when the transaction or processing result occurred.
        payload:
          $ref: "#/components/schemas/TransactionPayload"

    WSAccountStateEvent:
      type: object
      description: Trading streaming event envelope for periodic account state updates.
      required:
        - event_type
        - event_time
        - payload
      properties:
        event_type:
          type: string
          enum:
            - account_state_event
        event_time:
          type: string
          format: date-time
          description: Time when the account state snapshot was generated.
        payload:
          $ref: "#/components/schemas/AccountStateEventPayload"

    WSInstrumentEvent:
      type: object
      description: >
        Event envelope for account-scoped instrument condition/configuration updates.
        The payload contains a full current instrument condition snapshot for the selected account.
      required:
        - event_type
        - event_time
        - action
        - payload
      properties:
        event_type:
          type: string
          enum:
            - instrument_event
        event_time:
          type: string
          format: date-time
          description: Time when the instrument condition update was generated.
        action:
          $ref: "#/components/schemas/InstrumentEventAction"
        payload:
          $ref: "#/components/schemas/InstrumentConditionResponse"

    # ------------------------------------------------------------------
    # HMR period schemas
    # ------------------------------------------------------------------

    WSHmrSnapshotEvent:
      type: object
      description: |
        `hmr_snapshot` contains the full active and scheduled future HMR period state applicable to the selected account.
        The server sends it after a successful `hmr` subscription and may send it again only when the account's
        effective flexible HMR status changes during the active session.

        HMR snapshot events are delivered without the generic `payload` wrapper.
        The `periods` field is placed at the event top level.
        `event_time` is not included in the current version.
      required:
        - event_type
        - periods
      properties:
        event_type:
          type: string
          enum:
            - hmr_snapshot
        periods:
          type: array
          description: Full active and scheduled future set of HMR periods applicable to the selected account.
          items:
            $ref: "#/components/schemas/HmrPeriod"

    WSHmrUpdateEvent:
      type: object
      description: |
        `hmr_update` contains incremental HMR period changes observed while the subscription is active.
        Apply updates on top of the latest snapshot; replace local state whenever a new snapshot arrives.

        HMR update events are delivered without the generic `payload` wrapper.
        The `upserted_periods` and `removed_period_ids` fields are placed at the event top level.
        `event_time` is not included in the current version.
      required:
        - event_type
        - upserted_periods
        - removed_period_ids
      properties:
        event_type:
          type: string
          enum:
            - hmr_update
        upserted_periods:
          type: array
          description: HMR periods that were created or updated.
          items:
            $ref: "#/components/schemas/HmrPeriod"
        removed_period_ids:
          type: array
          description: Removed HMR period identifiers.
          items:
            $ref: "#/components/schemas/UInt64String"

    HmrPeriod:
      type: object
      description: |
        High Margin Requirement period visible to the client. Snapshot periods may be active now or scheduled
        for the future.
      required:
        - period_id
        - event_type
        - instruments
        - leverage
        - start_time
        - end_time
      properties:
        period_id:
          $ref: "#/components/schemas/UInt64String"
        event_type:
          $ref: "#/components/schemas/HmrPeriodEventType"
        instruments:
          type: array
          minItems: 1
          description: Instruments affected by this HMR period.
          items:
            $ref: "#/components/schemas/InstrumentName"
        leverage:
          type: string
          description: Maximum leverage during the HMR period.
        start_time:
          type: string
          description: |
            HMR period start time as configured by the server. `regular` periods use absolute
            `YYYY-MM-DD HH:MM:SS` time; `periodic` periods use weekly `Day, HH:MM:SS` time.
        end_time:
          type: string
          description: |
            HMR period end time as configured by the server. `regular` periods use absolute
            `YYYY-MM-DD HH:MM:SS` time; `periodic` periods use weekly `Day, HH:MM:SS` time.

    HmrPeriodEventType:
      type: string
      description: |
        HMR period schedule type:
        - `regular` - a certain one-time event
        - `periodic` - an event that repeats every week
      enum:
        - regular
        - periodic

    AccountSettings:
      type: object
      description: Account settings.
      required:
        - currency
        - leverage
        - account_status
        - trade_mode
        - execution_mode
      properties:
        currency:
          type: string
          description: Account currency
        leverage:
          type: string
          description: Account leverage
        margin_call_level:
          $ref: "#/components/schemas/DecimalString"
          description: Margin call level
        stopout_level:
          $ref: "#/components/schemas/DecimalString"
          description: Stop out level
        trade_mode:
          $ref: "#/components/schemas/TradeMode"
        account_status:
          $ref: "#/components/schemas/AccountTradingStatus"
        execution_mode:
          $ref: "#/components/schemas/ExecutionMode"

    SwapMultiplier:
      type: object
      properties:
        day:
          type: string
          example: WED
        multiplier:
          type: integer
          format: int32
          example: 3

    CommissionSettings:
      type: object
      properties:
        commission_type:
          $ref: "#/components/schemas/CommissionType"
        commission_value:
          $ref: "#/components/schemas/Money"

    InstrumentSession:
      type: object
      description: Optional instrument session details. Boundary fields are omitted when not provided.
      properties:
        trade_mode:
          $ref: "#/components/schemas/TradeMode"
        week_start_time:
          type: string
          description: Session start time in UTC. Omitted when the session start boundary is not provided.
          example: "Mon, 10:00:00"
        week_end_time:
          type: string
          description: Session end time in UTC. Omitted when the session end boundary is not provided.
          example: "Mon, 11:59:59"